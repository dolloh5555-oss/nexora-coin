services:
  - type: web
    name: nexora-public-free
    runtime: node
    rootDir: NEX-Render-Free/nexora-render
    plan: free
    buildCommand: node --check server.cjs
    startCommand: node server.cjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
